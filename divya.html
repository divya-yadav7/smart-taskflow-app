<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Smart Task & Productivity Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md py-4 px-6 mb-8">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">📋 TaskFlow</h1>
            <p class="text-indigo-200 text-sm">Smart Productivity & Task Manager</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pb-12">
        
        <!-- Add Task Card -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
            <h2 class="text-md font-semibold text-slate-700 mb-4">Add New Task</h2>
            <form id="taskForm" class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="taskInput" required placeholder="What needs to be done?" class="flex-grow px-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                
                <select id="taskPriority" class="px-4 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="Normal">Normal Priority</option>
                    <option value="Urgent">Urgent</option>
                    <option value="Important">Important</option>
                </select>

                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2 rounded-lg text-sm transition shadow-sm">
                    Add Task
                </button>
            </form>
        </div>

        <!-- Task List Section -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                <h2 class="text-md font-semibold text-slate-700">Your Task Dashboard</h2>
                <span id="taskStats" class="text-xs font-medium bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full border border-indigo-200">0 tasks remaining</span>
            </div>

            <ul id="taskList" class="space-y-3">
                <!-- Tasks dynamically added here -->
            </ul>

            <div id="emptyState" class="text-center py-12 text-slate-400 text-sm">
                No tasks added yet. Start by adding one above!
            </div>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const taskForm = document.getElementById("taskForm");
            const taskInput = document.getElementById("taskInput");
            const taskPriority = document.getElementById("taskPriority");
            const taskList = document.getElementById("taskList");
            const taskStats = document.getElementById("taskStats");
            const emptyState = document.getElementById("emptyState");

            let tasks = JSON.parse(localStorage.getItem("taskflow_items")) || [];

            function renderTasks() {
                taskList.innerHTML = "";
                const remaining = tasks.filter(t => !t.completed).length;
                taskStats.textContent = `${remaining} tasks remaining`;

                if (tasks.length === 0) {
                    emptyState.classList.remove("hidden");
                    return;
                } else {
                    emptyState.classList.add("hidden");
                }

                tasks.forEach((task, index) => {
                    let priorityColor = "bg-slate-100 text-slate-700";
                    if (task.priority === "Urgent") priorityColor = "bg-rose-100 text-rose-800";
                    if (task.priority === "Important") priorityColor = "bg-amber-100 text-amber-800";

                    const li = document.createElement("li");
                    li.className = `flex items-center justify-between p-3.5 rounded-lg border border-slate-200 transition ${task.completed ? 'bg-slate-50 opacity-60 line-through' : 'bg-white'}`;
                    
                    li.innerHTML = `
                        <div class="flex items-center gap-3">
                            <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask(${index})" class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer">
                            <span class="text-sm font-medium text-slate-800">${escapeHtml(task.text)}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${priorityColor}">${task.priority}</span>
                            <button onclick="deleteTask(${index})" class="text-rose-500 hover:text-rose-700 text-xs font-medium px-2 py-1 rounded border border-rose-200 hover:bg-rose-50 transition">Delete</button>
                        </div>
                    `;
                    taskList.appendChild(li);
                });
            }

            taskForm.addEventListener("submit", (e) => {
                e.preventDefault();
                const text = taskInput.value.trim();
                if(!text) return;

                tasks.push({
                    text: text,
                    priority: taskPriority.value,
                    completed: false
                });

                localStorage.setItem("taskflow_items", JSON.stringify(tasks));
                taskInput.value = "";
                renderTasks();
            });

            window.toggleTask = function(index) {
                tasks[index].completed = !tasks[index].completed;
                localStorage.setItem("taskflow_items", JSON.stringify(tasks));
                renderTasks();
            }

            window.deleteTask = function(index) {
                tasks.splice(index, 1);
                localStorage.setItem("taskflow_items", JSON.stringify(tasks));
                renderTasks();
            }

            function escapeHtml(text) {
                return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }

            renderTasks();
        });
    </script>
</body>
</html>
